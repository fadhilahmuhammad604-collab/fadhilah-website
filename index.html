<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Fadhilah</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            text-align: center;
        }

        header {
            background: #172554;
            color: white;
            padding: 30px;
        }

        nav {
            background: #1e40af;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
        }

        .content {
            padding: 60px 20px;
        }

        button {
            background: #2563eb;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <header>
        <h1>Website Fadhilah</h1>
        <p>Selamat Datang di Website Saya</p>
    </header>

    <nav>
        <a href="#">Beranda</a>
        <a href="#tentang">Tentang</a>
        <a href="#kontak">Kontak</a>
    </nav>

    <div class="content">
        <h2>Halo, Selamat Datang!</h2>
        <p>Ini adalah website pertama saya.</p>

        <button onclick="alert('Terima kasih sudah berkunjung!')">
            Klik Saya
        </button>

        <h2 id="tentang">Tentang Saya</h2>
        <p>Website ini dibuat menggunakan HTML dan CSS.</p>

        <h2 id="kontak">Kontak</h2>
        <p>Hubungi saya melalui email.</p>
    </div>

</body>
</html>
