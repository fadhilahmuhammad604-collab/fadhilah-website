<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FADHILAH FASHION</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f8f8f8;
    color: #222;
}

header {
    background: #111;
    color: white;
    padding: 22px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
}

header h2 {
    letter-spacing: 2px;
}

nav a {
    color: white;
    text-decoration: none;
    margin-left: 20px;
}

.hero {
    background: #222;
    color: white;
    padding: 85px 8%;
    text-align: center;
}

.hero h1 {
    font-size: 42px;
    margin-bottom: 15px;
}

.hero p {
    margin-bottom: 20px;
}

.section {
    padding: 50px 8%;
}

.section h2 {
    text-align: center;
    margin-bottom: 30px;
}

.products {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(230px,1fr));
    gap: 25px;
}

.product {
    background: white;
    padding: 15px;
    border-radius: 8px;
}

.product img {
    width: 100%;
    height: 250px;
    object-fit: cover;
}

.product h3 {
    margin: 12px 0;
}

.price {
    font-weight: bold;
    margin-bottom: 12px;
}

select, input {
    width: 100%;
    padding: 11px;
    margin: 7px 0;
    border: 1px solid #ccc;
    border-radius: 4px;
}

.product button {
    width: 100%;
    padding: 12px;
    background: #111;
    color: white;
    border: none;
    cursor: pointer;
    margin-top: 10px;
}

.cart {
    background: white;
    padding: 25px;
    margin-top: 40px;
    border-radius: 8px;
}

.cart-item {
    border-bottom: 1px solid #ddd;
    padding: 15px 0;
}

.cart-item button {
    padding: 6px 12px;
    background: #b22222;
    color: white;
    border: none;
    margin-top: 8px;
    cursor: pointer;
}

.checkout {
    background: #168b48;
    color: white;
    padding: 14px 20px;
    border: none;
    margin-top: 20px;
    cursor: pointer;
}

footer {
    background: #111;
    color: white;
    padding: 25px;
    text-align: center;
    margin-top: 40px;
}

@media(max-width:600px) {
    header {
        flex-direction: column;
        gap: 15px;
    }

    .hero h1 {
        font-size: 30px;
    }
}
</style>
</head>

<body>

<header>
    <h2>FADHILAH FASHION</h2>
    <nav>
        <a href="#home">Home</a>
        <a href="#produk">Produk</a>
        <a href="#keranjang">Keranjang</a>
    </nav>
</header>

<section class="hero" id="home">
    <h1>FASHION FOR EVERYONE</h1>
    <p>Upgrade your style with Fadhilah Fashion.</p>
</section>

<section class="section" id="produk">

<h2>KOLEKSI PRODUK</h2>

<div class="products" id="productList"></div>

<div class="cart" id="keranjang">
    <h2>KERANJANG BELANJA</h2>

    <div id="cartItems">
        Keranjang masih kosong.
    </div>

    <h3 id="total">Total: Rp0</h3>

    <button class="checkout" onclick="checkout()">
        Checkout WhatsApp
    </button>
</div>

</section>

<footer>
    <h3>FADHILAH FASHION</h3>
    <p>© 2026 Fadhilah Fashion</p>
</footer>

<script>

const products = [
    {
        id: 1,
        name: "Basic T-Shirt",
        price: 75000,
        stock: 20,
        image: "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=500",
        colors: ["Hitam", "Putih", "Abu-abu"]
    },
    {
        id: 2,
        name: "Premium Hoodie",
        price: 150000,
        stock: 15,
        image: "https://images.unsplash.com/photo-1556821840-3a63f95609a7?w=500",
        colors: ["Hitam", "Cream", "Navy"]
    },
    {
        id: 3,
        name: "Casual Shirt",
        price: 120000,
        stock: 12,
        image: "https://images.unsplash.com/photo-1598033129183-c4f50c736f10?w=500",
        colors: ["Putih", "Biru", "Hitam"]
    },
    {
        id: 4,
        name: "Fashion Jacket",
        price: 180000,
        stock: 10,
        image: "https://images.unsplash.com/photo-1551028719-00167b16eac5?w=500",
        colors: ["Hitam", "Coklat", "Abu-abu"]
    }
];

const sizes = ["S", "M", "L", "XL", "XXL"];

let cart = [];

function rupiah(value) {
    return "Rp" + value.toLocaleString("id-ID");
}

function showProducts() {

    const list = document.getElementById("productList");

    list.innerHTML = products.map((p, index) => `
        <div class="product">

            <img src="${p.image}" alt="${p.name}">

            <h3>${p.name}</h3>

            <p class="price">${rupiah(p.price)}</p>

            <p>Stok tersedia: ${p.stock}</p>

            <label>Ukuran:</label>

            <select id="size-${index}">
                ${sizes.map(s => `
                    <option value="${s}">${s}</option>
                `).join("")}
            </select>

            <label>Warna:</label>

            <select id="color-${index}">
                ${p.colors.map(c => `
                    <option value="${c}">${c}</option>
                `).join("")}
            </select>

            <label>Jumlah:</label>

            <input
                type="number"
                id="qty-${index}"
                value="1"
                min="1"
                max="${p.stock}"
            >

            <button onclick="addCart(${index})">
                Tambah ke Keranjang
            </button>

        </div>
    `).join("");
}

function addCart(index) {

    const product = products[index];

    const size = document.getElementById("size-" + index).value;
    const color = document.getElementById("color-" + index).value;
    const qty = Number(document.getElementById("qty-" + index).value);

    if (!Number.isInteger(qty) || qty < 1 || qty > product.stock) {
        alert("Jumlah pembelian melebihi stok atau tidak valid!");
        return;
    }

    const existing = cart.find(item =>
        item.id === product.id &&
        item.size === size &&
        item.color === color
    );

    const alreadyOrdered = existing ? existing.qty : 0;

    if (alreadyOrdered + qty > product.stock) {
        alert("Jumlah produk melebihi stok yang tersedia!");
        return;
    }

    if (existing) {
        existing.qty += qty;
    } else {
        cart.push({
            id: product.id,
            name: product.name,
            price: product.price,
            size: size,
            color: color,
            qty: qty
        });
    }

    showCart();

    alert("Produk berhasil ditambahkan ke keranjang!");
}

function removeCart(index) {
    cart.splice(index, 1);
    showCart();
}

function showCart() {

    const container = document.getElementById("cartItems");

    if (cart.length === 0) {
        container.innerHTML = "Keranjang masih kosong.";
    } else {

        container.innerHTML = cart.map((item, index) => `
            <div class="cart-item">

                <h4>${item.name}</h4>

                <p>Ukuran: ${item.size}</p>
                <p>Warna: ${item.color}</p>
                <p>Jumlah: ${item.qty}</p>

                <p>Harga: ${rupiah(item.price * item.qty)}</p>

                <button onclick="removeCart(${index})">
                    Hapus Produk
                </button>

            </div>
        `).join("");
    }

    const total = cart.reduce(
        (sum, item) => sum + item.price * item.qty,
        0
    );

    document.getElementById("total").innerText =
        "Total: " + rupiah(total);
}

function checkout() {

    if (cart.length === 0) {
        alert("Keranjang masih kosong!");
        return;
    }

    // GANTI DENGAN NOMOR WHATSAPP TOKO
    const phone = "6281234567890";

    let message = "Halo Fadhilah Fashion, saya ingin memesan:\n\n";

    cart.forEach((item, index) => {

        message +=
            `${index + 1}. ${item.name}\n` +
            `Ukuran: ${item.size}\n` +
            `Warna: ${item.color}\n` +
            `Jumlah: ${item.qty}\n` +
            `Subtotal: ${rupiah(item.price * item.qty)}\n\n`;
    });

    const total = cart.reduce(
        (sum, item) => sum + item.price * item.qty,
        0
    );

    message += "TOTAL: " + rupiah(total);

    window.open(
        "https://wa.me/" + phone +
        "?text=" + encodeURIComponent(message),
        "_blank"
    );
}

showProducts();
showCart();

</script>

</body>
</html>
